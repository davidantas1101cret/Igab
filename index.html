<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iBag — monte sua sacola</title>
<style>
:root{--bg:#fbfaf6;--card:#fff;--ink:#14201a;--mut:#6b746d;--pri:#1f4d3a;--on:#fff;--pink:#ff8fb1;--sun:#ffcf4a;--line:#e3e1d6;--bad:#d93a4f;--ok:#1fa36b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--card:#17261e;--ink:#f3f1e8;--mut:#9fb0a4;--pri:#6fe3a5;--on:#0f1a14;--line:#28402f}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:6rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:.55rem 1rem;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.pri{background:var(--pri);color:var(--on);border-color:var(--pri)}
.sun{background:var(--sun);color:#14201a;border-color:var(--sun)}
input,select,textarea{width:100%;padding:.65rem .9rem;border-radius:14px;border:1.5px solid var(--line);background:var(--card)}
header{display:flex;align-items:center;gap:.6rem;padding:.8rem clamp(1rem,4vw,3rem);flex-wrap:wrap}
.logo{font-size:1.9rem;font-weight:900;letter-spacing:-.06em;color:var(--pri);margin-right:auto}
.logo b{display:inline-block;background:var(--pink);color:#14201a;border-radius:50% 50% 50% 8px;width:1.7rem;height:1.7rem;text-align:center;line-height:1.7rem;font-size:1.1rem;margin-right:.25rem;transform:rotate(-8deg)}
#conn{font-size:.8rem;display:flex;align-items:center;gap:.4rem}
#conn i{width:.6rem;height:.6rem;border-radius:50%;background:var(--mut)}
#conn.ok i{background:var(--ok)}#conn.off i{background:var(--bad)}
.top{display:grid;grid-template-columns:1.1fr .9fr;gap:2rem;padding:1.5rem clamp(1rem,4vw,3rem) 1rem;align-items:center}
@media(max-width:800px){.top{grid-template-columns:1fr}}
h1{font-size:clamp(2.4rem,8vw,5.5rem);line-height:.92;letter-spacing:-.06em;font-weight:900}
h1 em{font-style:normal;display:inline-block;background:var(--sun);color:#14201a;padding:0 .2em;border-radius:.2em;transform:rotate(-2deg)}
.magic{background:var(--pri);color:var(--on);border-radius:28px;padding:1.4rem;display:flex;flex-direction:column;gap:.8rem}
.magic h2{font-size:1.4rem;letter-spacing:-.03em}
.magic output{font-size:3rem;font-weight:900;letter-spacing:-.05em;line-height:1}
.magic input[type=range]{padding:0;accent-color:var(--sun);border:0;background:none}
.magic p{opacity:.85;font-size:.9rem}
.rail{display:flex;gap:.9rem;overflow-x:auto;padding:1rem clamp(1rem,4vw,3rem);scrollbar-width:none}
.rail button{display:flex;flex-direction:column;align-items:center;gap:.3rem;border:0;background:none;padding:0;font-size:.82rem;color:var(--mut);white-space:nowrap}
.rail button span{width:4rem;height:4rem;border-radius:50%;display:grid;place-items:center;font-size:1.9rem;background:var(--card);border:2px solid var(--line);transition:.2s}
.rail button.on{color:var(--ink)}.rail button.on span{background:var(--pink);border-color:var(--pink);transform:scale(1.12)}
.tools{display:flex;gap:.6rem;padding:0 clamp(1rem,4vw,3rem);flex-wrap:wrap}
.tools input{flex:1;min-width:180px}.tools select{width:auto}
.list{padding:.5rem clamp(1rem,4vw,3rem)}
.it{display:grid;grid-template-columns:4.5rem 1fr auto;gap:1rem;align-items:center;padding:1rem 0;border-bottom:1.5px dashed var(--line)}
.it.hl{animation:hl 1.6s}
@keyframes hl{30%{background:var(--sun);color:#14201a}}
.tile{width:4.5rem;height:4.5rem;border-radius:22px 22px 22px 6px;display:grid;place-items:center;font-size:2.4rem;background:hsl(var(--h) 85% 84%);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.it h3{font-size:1.15rem;letter-spacing:-.02em}
.it p{color:var(--mut);font-size:.88rem;max-width:52ch}
.it small{color:var(--mut)}
.buy{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:.4rem}
.buy b{font-size:1.25rem;letter-spacing:-.03em}
.step{display:flex;align-items:center;gap:.5rem}.step button{width:2rem;height:2rem;padding:0}
.sk{height:5rem;margin:.6rem 0;border-radius:20px;background:linear-gradient(90deg,var(--card) 30%,var(--line) 50%,var(--card) 70%);background-size:300% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-100% 0}}
#dock{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:.8rem;background:var(--ink);color:var(--bg);border:0;padding:.7rem 1.3rem;box-shadow:0 10px 40px #0004;max-width:94vw}
#stack{display:flex}#stack span{font-size:1.4rem;margin-left:-.4rem}
#dock.bump{animation:bump .4s}
@keyframes bump{40%{transform:translateX(-50%) scale(1.12)}}
.fly{position:fixed;font-size:2rem;z-index:80;pointer-events:none}
#ov{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:.25s;z-index:30}
#ov.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:50%;bottom:0;width:min(600px,100%);max-height:88vh;background:var(--bg);z-index:31;border-radius:28px 28px 0 0;transform:translate(-50%,105%);transition:.35s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column}
#sh.on{transform:translate(-50%,0)}
#sh h2{padding:1.1rem 1.3rem .5rem;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.03em}
#db{overflow:auto;padding:.5rem 1.3rem 1.5rem;display:flex;flex-direction:column;gap:.8rem}
.ln{display:flex;gap:.8rem;align-items:center}.ln div{flex:1}.ln .e{font-size:1.8rem}
.tot{display:flex;justify-content:space-between;font-size:1.4rem;font-weight:900;letter-spacing:-.03em}
.ord{border:1.5px solid var(--line);border-radius:22px;padding:1rem;display:flex;flex-direction:column;gap:.7rem;background:var(--card)}
.road{position:relative;height:6px;margin:1.4rem .6rem .3rem;border-radius:6px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 18px)}
.road u{position:absolute;left:0;top:0;height:6px;border-radius:6px;background:var(--pri);transition:width 1s;text-decoration:none}
.road i{position:absolute;top:-1.3rem;font-style:normal;font-size:1.6rem;transform:translateX(-50%);transition:left 1s}
.lbl{display:flex;justify-content:space-between;font-size:.72rem;color:var(--mut)}.lbl .on{color:var(--ink);font-weight:800}
.tag{font-size:.78rem;padding:.1rem .6rem;border-radius:99px;background:var(--sun);color:#14201a;font-weight:800}.tag.bad{background:var(--bad);color:#fff}
.acts{display:flex;gap:.4rem;flex-wrap:wrap}.acts button{padding:.35rem .8rem;font-size:.85rem}
.r2{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
#modal{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:#0009;padding:1rem}
#modal.on{display:grid}
#modal form{background:var(--bg);border-radius:26px;padding:1.4rem;width:min(400px,100%);display:flex;flex-direction:column;gap:.7rem}
.tabs{display:flex;gap:.4rem}.tabs button{flex:1}.tabs button.on{background:var(--ink);color:var(--bg)}
#toasts{position:fixed;left:50%;top:1rem;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:.4rem;align-items:center}
.toast{background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:99px;font-weight:700;animation:tin .3s}.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.conf{position:fixed;font-size:1.6rem;pointer-events:none;z-index:70;animation:fall 1.6s forwards}
@keyframes fall{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
.empty{text-align:center;color:var(--mut);padding:2rem 1rem}
details{border:1.5px solid var(--line);border-radius:18px;padding:.8rem;background:var(--card)}
details form{display:flex;flex-direction:column;gap:.5rem;margin-top:.6rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root[data-theme="dark"]{--bg:#0f1a14;--card:#17261e;--ink:#f3f1e8;--mut:#9fb0a4;--pri:#6fe3a5;--on:#0f1a14;--line:#28402f}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#dock{bottom:calc(1rem + env(safe-area-inset-bottom,0px))}
.demo{background:var(--sun);color:#14201a;text-align:center;font-size:.85rem;padding:.45rem 1rem;font-weight:600}
.heart{border:0;background:none;padding:0;font-size:1.25rem;line-height:1}
.tile[data-det]{cursor:pointer}
.star{border:0;background:none;padding:0 .1rem;font-size:1.1rem}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.kpi{background:var(--pri);color:var(--on);border-radius:18px;padding:.8rem}.kpi b{display:block;font-size:1.15rem;letter-spacing:-.03em}.kpi small{opacity:.85}
.tools select#srt{width:auto}
.foot{text-align:center;color:var(--mut);font-size:.82rem;padding:2rem 1rem}

/* ===== tema vermelho e branco ===== */
:root{--bg:#f7f7f7;--card:#fff;--ink:#3e3e3e;--mut:#717171;--pri:#ea1d2c;--on:#fff;--pink:#ffe3e5;--sun:#ffc72c;--line:#e8e8e8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181818;--card:#242424;--ink:#f2f2f2;--mut:#a8a8a8;--pri:#ea1d2c;--on:#fff;--pink:#3a1d20;--line:#363636}}
:root[data-theme="dark"]{--bg:#181818;--card:#242424;--ink:#f2f2f2;--mut:#a8a8a8;--pri:#ea1d2c;--on:#fff;--pink:#3a1d20;--line:#363636}
#conn{display:none}
header{background:var(--card);box-shadow:0 1px 0 var(--line)}
.logo b{background:var(--pri);color:#fff}
.sun{background:var(--pri);color:#fff;border-color:var(--pri)}
.magic .sun{background:#fff;color:var(--pri);border-color:#fff}
.magic{background:var(--pri);color:#fff}
h1 em{background:var(--pri);color:#fff}
.rail button.on span{background:var(--pink);border-color:var(--pri)}
.rail button.on{color:var(--pri);font-weight:700}
#dock{background:var(--pri);color:#fff}
.tabs button.on,.kpi{background:var(--pri);color:#fff}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:.8rem;padding-top:1rem}
.it{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.9rem;border-bottom:1px solid var(--line)}
.it .buy>b{color:var(--ink)}
.empty,.sk{grid-column:1/-1}
.tile{border-radius:14px}
</style>
</head>
<body>
<header>
  <div class="logo"><b>i</b>Bag</div>
  <button id="conn" title="Configurar endereço da API"><i></i><span>conectando…</span></button>
  <button id="bOrd">📦 Pedidos</button>
  <button id="bUser" class="pri">Entrar</button>
</header>

<section class="top">
  <h1>Monte a sua <em>sacola</em>, a gente leva.</h1>
  <div class="magic">
    <h2>✨ Combo mágico</h2>
    <p>Diga quanto quer gastar e a gente monta prato, bebida e sobremesa que cabem no valor.</p>
    <output id="bv">R$ 60</output>
    <input id="bud" type="range" min="20" max="200" step="5" value="60" aria-label="Orçamento">
    <button class="sun" id="mix">Montar meu combo</button>
  </div>
</section>

<nav id="cats" class="rail" aria-label="Categorias"></nav>
<div class="tools">
  <input id="q" type="search" placeholder="Buscar prato, bebida ou loja" aria-label="Buscar">
  <select id="st" aria-label="Loja"></select>
  <select id="srt" aria-label="Ordenar"><option value="">Ordenar: relevância</option><option value="lo">Menor preço</option><option value="hi">Maior preço</option><option value="top">Lojas mais bem avaliadas</option></select>
  <button id="favb">🤍 Favoritos</button>
  <button id="surp">🎲 Surpreenda-me</button>
</div>
<main id="list" class="list"></main>
<footer class="foot">© 2026 iBag · Peça, acompanhe e receba.</footer>

<button id="dock" class="pri" aria-label="Abrir sacola"><span id="stack"></span><span id="dl">Sacola vazia</span></button>
<div id="ov"></div>
<section id="sh"><h2><span id="dt"></span><button id="dx" aria-label="Fechar">✕</button></h2><div id="db"></div></section>
<div id="modal"></div>
<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const LS = (() => { try { const k = '__t'; localStorage.setItem(k, k); localStorage.removeItem(k); return localStorage; } catch (e) { return {}; } })();
/* ===== CONEXÃO COM A API =====
   Ordem: ?api=URL na barra de endereço > valor salvo (clique no ponto de status) > mesma origem (site servido pelo FastAPI) > localhost:8000 */
const API = (new URLSearchParams(location.search).get('api') || LS.api ||
  (location.protocol.startsWith('http') ? '' : 'http://localhost:8000')).replace(/\/$/, '');

const $ = s => document.querySelector(s);
const S = {cats:[],stores:[],prods:[],cat:0,store:0,q:'',cart:JSON.parse(LS.cart || '{}'),user:null,token:LS.token || null,dr:null};
const STEPS = [['received','Recebido'],['preparing','Preparando'],['out_for_delivery','A caminho'],['completed','Entregue']];
const EMO = {suco:'🧃',cerv:'🍺',sorv:'🍨',açaí:'🥣',acai:'🥣',água:'💧',agua:'💧',padar:'🥐',caf:'☕',pão:'🥐',croiss:'🥐',coxinha:'🍗',batata:'🍟',sandu:'🥪',taco:'🌮',burrito:'🌯',nacho:'🌮',wrap:'🌯',salada:'🥗',bowl:'🥗',espaguete:'🍝',lasanha:'🍝',massa:'🍝',burg:'🍔',búrg:'🍔',hamb:'🍔',pizz:'🍕',jap:'🍣',sush:'🍣',beb:'🥤',sobre:'🍰',exclus:'🛍️',sacola:'🛍️',mochila:'🎒',saud:'🥗',mex:'🌮'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = c => (c / 100).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});

/* ===== CONEXÃO COM O SUPABASE (banco PostgreSQL na nuvem) ===== */
const SUPABASE_URL = 'https://lkhwdsnkugqzekwgpeaz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AufJlODYpKlMRHniUs7tUQ_fGaH987F'; // chave pública: a segurança fica nas regras RLS do banco
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const tr = m => ({'Invalid login credentials':'E-mail ou senha incorretos', 'Email not confirmed':'Confirme seu e-mail (veja a caixa de entrada) antes de entrar', 'User already registered':'E-mail já cadastrado'}[m]
  || (/row-level security/.test(m) ? 'Acesso restrito a administradores' : /Password should be/.test(m) ? 'A senha precisa ter 6 ou mais caracteres' : m));
const ok = ({data, error}) => { if (error) throw new Error(tr(error.message)); return data; };
async function me() {
  const {data:{session}} = await sb.auth.getSession();
  if (!session) { if (S.token) logout(true); throw new Error('Entre na sua conta'); }
  const pr = ok(await sb.from('profiles').select('name,role').eq('id', session.user.id).single());
  return {id:session.user.id, name:pr.name, email:session.user.email, role:pr.role};
}
async function api(path, o = {}) {
  const [p] = path.split('?'), m = (o.method || 'GET').toUpperCase();
  const b = o.json || (o.body ? Object.fromEntries(o.body) : {});
  if (p === '/health') { ok(await sb.from('categories').select('id').limit(1)); return {status:'ok'}; }
  if (p === '/categories') return ok(await sb.from('categories').select('*').order('id'));
  if (p === '/stores') return ok(await sb.from('stores').select('*').order('rating', {ascending:false}));
  if (p === '/products' && m === 'GET') return ok(await sb.from('products').select('*').eq('active', true).order('id').limit(500));
  if (p === '/products') return ok(await sb.from('products').insert({name:b.name, description:b.description || '', price_cents:b.price_cents, store_id:b.store_id, category_id:b.category_id}).select().single());
  if (p === '/auth/register') return ok(await sb.auth.signUp({email:b.email, password:b.password, options:{data:{name:b.name}}}));
  if (p === '/auth/login') { ok(await sb.auth.signInWithPassword({email:b.username, password:b.password})); return {access_token:'sb', user:await me()}; }
  if (p === '/auth/me') return me();
  if (p === '/orders' && m === 'GET') {
    const rows = ok(await sb.from('orders').select('*, items:order_items(product_id,product_name_snapshot,unit_price_cents,quantity), cliente:profiles(name)').order('id', {ascending:false}).limit(200));
    return rows.map(r => ({...r, cliente:r.cliente?.name}));
  }
  if (p === '/orders' && m === 'POST') return {id:ok(await sb.rpc('create_order', {p_address:b.delivery_address, p_items:b.items}))};
  const mt = p.match(/^\/orders\/(\d+)\/status$/);
  if (mt && m === 'PATCH') { ok(await sb.rpc('set_order_status', {p_id:+mt[1], p_status:b.status})); return {}; }
  throw new Error('Rota não encontrada: ' + p);
}
/* ===== FIM DA CONEXÃO ===== */
const toast = (m, bad) => { const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = m; $('#toasts').append(t); setTimeout(() => t.remove(), 3200); };
function burst(e) {
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('span'); s.className = 'conf'; s.textContent = e;
    s.style.cssText = `left:50%;top:70%;--x:${(Math.random() - .5) * 90}vw;--y:${-Math.random() * 60 - 10}vh`;
    document.body.append(s); setTimeout(() => s.remove(), 1700);
  }
}
const kind = p => { const k = (p.name + ' ' + (S.cats.find(c => c.id === p.category_id)?.name || '')).toLowerCase();
  return /exclus|sacola|mochila/.test(k) ? 'x' : /beb|suco|cerv|refri/.test(k) ? 'd' : /sobre|doce|sorv|bolo/.test(k) ? 's' : 'm'; };
const emo = p => { const k = (p.name + ' ' + (S.cats.find(c => c.id === p.category_id)?.name || '')).toLowerCase();
  return Object.entries(EMO).find(([w]) => k.includes(w))?.[1] || '🍽️'; };
const storeOf = id => S.stores.find(s => s.id === id);
function fly(from, e) {
  const a = from.getBoundingClientRect(), b = $('#dock').getBoundingClientRect(), s = document.createElement('span');
  s.className = 'fly'; s.textContent = e; s.style.left = a.left + 'px'; s.style.top = a.top + 'px'; document.body.append(s);
  s.animate([{transform:'translate(0,0) scale(1)'}, {transform:`translate(${b.left + 30 - a.left}px,${b.top - a.top}px) scale(.4)`, opacity:.6}], {duration:650, easing:'cubic-bezier(.5,-.3,.8,.6)'}).onfinish = () => s.remove();
}

/* ===== Vitrine ===== */
function renderTop() {
  $('#cats').innerHTML = [{id:0,name:'Tudo'}, ...S.cats].map(c => `<button class="${S.cat === c.id ? 'on' : ''}" data-cat="${c.id}"><span>${c.id ? emo({name:c.name}) : '✨'}</span>${esc(c.name)}</button>`).join('');
  $('#st').innerHTML = '<option value="0">Todas as lojas</option>' + S.stores.map(s => `<option value="${s.id}" ${S.store === s.id ? 'selected' : ''}>${esc(s.name)} ⭐${Number(s.rating).toFixed(1)}</option>`).join('');
}
function renderList() {
  const q = S.q.toLowerCase();
  const l = S.prods.filter(p => (!S.cat || p.category_id === S.cat) && (!S.store || p.store_id === S.store) && (!q || (p.name + p.description + (storeOf(p.store_id)?.name || '')).toLowerCase().includes(q)));
  const l2 = sortL(l.filter(p => !X.onlyFav || X.fav.includes(p.id)));
  $('#list').innerHTML = l2.length ? l2.map(p => { const n = S.cart[p.id] || 0;
    return `<article class="it" id="p${p.id}"><div class="tile" data-det="${p.id}" style="--h:${((p.category_id || 0) * 53 + 120) % 360}">${p.image_url ? `<img src="${esc(p.image_url)}" alt="">` : emo(p)}</div>
    <div><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><small>${esc(storeOf(p.store_id)?.name || 'iBag')}</small></div>
    <div class="buy"><button class="heart" data-fav="${p.id}" aria-label="Favoritar" aria-pressed="${X.fav.includes(p.id)}">${X.fav.includes(p.id) ? '❤️' : '🤍'}</button><b>${money(p.price_cents)}</b>${n ? `<div class="step"><button data-dec="${p.id}" aria-label="Menos">−</button><b>${n}</b><button data-inc="${p.id}" aria-label="Mais">+</button></div>` : `<button class="pri" data-inc="${p.id}">Adicionar</button>`}</div></article>`; }).join('')
    : '<div class="empty">Nada por aqui. Tente outra busca ou limpe os filtros.</div>';
}
function saveCart() {
  LS.cart = JSON.stringify(S.cart);
  const its = Object.entries(S.cart).map(([i, n]) => [S.prods.find(p => p.id == i), n]).filter(x => x[0]);
  const n = its.reduce((a, x) => a + x[1], 0), t = its.reduce((a, x) => a + x[0].price_cents * x[1], 0);
  $('#stack').innerHTML = its.slice(0, 5).map(x => `<span>${emo(x[0])}</span>`).join('');
  $('#dl').textContent = n ? `${n} ${n > 1 ? 'itens' : 'item'} · ${money(t)}` : 'Sacola vazia';
  const d = $('#dock'); d.classList.remove('bump'); void d.offsetWidth; d.classList.add('bump');
}
function change(id, d) {
  const n = (S.cart[id] || 0) + d;
  n <= 0 ? delete S.cart[id] : S.cart[id] = Math.min(n, 99);
  saveCart(); renderList(); if (S.dr === 'cart') showCart();
}
function combo() {
  const B = $('#bud').value * 100, by = k => S.prods.filter(p => kind(p) === k);
  const pick = (arr, max) => { const o = arr.filter(p => p.price_cents <= max); return o[Math.floor(Math.random() * o.length)]; };
  const m = pick(by('m'), B - 0); if (!m) return toast('Nenhum prato cabe nesse valor. Aumente o orçamento.', true);
  let left = B - m.price_cents; const got = [m];
  const d = pick(by('d'), left); if (d) { got.push(d); left -= d.price_cents; }
  const s = pick(by('s'), left); if (s) { got.push(s); left -= s.price_cents; }
  S.cart = {}; got.forEach((p, i) => setTimeout(() => { fly($('#mix'), emo(p)); S.cart[p.id] = 1; saveCart(); renderList(); }, i * 250));
  setTimeout(() => { burst('✨'); toast(`Combo de ${got.length} itens por ${money(B - left)}`); }, got.length * 250);
}

/* ===== Sacola e pedidos ===== */
function openSh(k) { S.dr = k; $('#sh').classList.add('on'); $('#ov').classList.add('on'); k === 'cart' ? showCart() : showOrders(); }
function closeSh() { S.dr = null; $('#sh').classList.remove('on'); $('#ov').classList.remove('on'); }
function showCart() {
  $('#dt').textContent = 'Sua sacola';
  const ids = Object.keys(S.cart).map(Number).filter(i => S.prods.some(p => p.id === i));
  if (!ids.length) { $('#db').innerHTML = '<div class="empty">🛍️<br>Sua sacola está vazia.<br>Use o combo mágico ou escolha da lista.</div>'; return; }
  let t = 0;
  $('#db').innerHTML = ids.map(id => { const p = S.prods.find(x => x.id === id), n = S.cart[id]; t += p.price_cents * n;
    return `<div class="ln"><span class="e">${emo(p)}</span><div><b>${esc(p.name)}</b><br><small>${money(p.price_cents)}</small></div><div class="step"><button data-dec="${id}">−</button><b>${n}</b><button data-inc="${id}">+</button></div></div>`; }).join('')
    + `<div class="tot"><span>Total</span><span>${money(t)}</span></div><small>⏱️ Entrega estimada: 25–40 min</small><textarea id="addr" rows="2" placeholder="Endereço de entrega (rua, número, bairro)">${esc(LS.addr || '')}</textarea><button class="sun" id="go">Finalizar pedido</button>`;
}
async function checkout() {
  if (!S.user) { toast('Entre na sua conta para finalizar', true); return authModal(); }
  const a = $('#addr').value.trim(); LS.addr = a;
  try {
    await api('/orders', {method:'POST', json:{delivery_address:a, items:Object.entries(S.cart).map(([product_id, quantity]) => ({product_id:+product_id, quantity}))}});
    S.cart = {}; saveCart(); renderList(); burst('🎉'); toast('Pedido enviado! A moto já está saindo.'); openSh('orders');
  } catch (e) { toast(e.message, true); }
}
async function showOrders() {
  const adm = S.user?.role === 'admin';
  $('#dt').textContent = adm ? 'Painel de pedidos' : 'Meus pedidos';
  if (!S.user) { $('#db').innerHTML = '<div class="empty">Entre na sua conta para ver seus pedidos.</div>'; return; }
  try {
    const os = X.orders = await api('/orders');
    $('#db').innerHTML = (adm ? dash(os) + adminForm() : '') + (os.length ? os.map(o => {
      const i = STEPS.findIndex(s => s[0] === o.status), bad = o.status === 'cancelled', nx = STEPS[i + 1];
      return `<div class="ord"><div class="r2"><b>Pedido #${o.id}</b><span class="tag ${bad ? 'bad' : ''}">${bad ? 'Cancelado' : STEPS[i][1]}</span></div>
      <small>${o.items.map(x => x.quantity + '× ' + esc(x.product_name_snapshot)).join(', ')}</small>
      ${bad ? '' : `<div class="road"><u style="width:${i / 3 * 92 + 4}%"></u><i style="left:${i / 3 * 92 + 4}%">${i === 3 ? '🏠' : '🛵'}</i></div><div class="lbl">${STEPS.map((s, k) => `<span class="${k <= i ? 'on' : ''}">${s[1]}</span>`).join('')}</div>`}
      <div class="r2"><b>${money(o.total_cents)}</b><div class="acts">${!adm ? `<button data-again="${o.id}">↻ Pedir de novo</button>` : ''}${!adm && o.status === 'completed' ? rate(o.id) : ''}
      ${adm && nx && !bad ? `<button class="pri" data-st="${o.id}:${nx[0]}">Avançar: ${nx[1]}</button>` : ''}
      ${(adm ? !bad && o.status !== 'completed' : o.status === 'received') ? `<button data-st="${o.id}:cancelled">Cancelar</button>` : ''}</div></div>
      ${adm ? `<small>Cliente ${esc(o.cliente || o.user_id)} · ${esc(o.delivery_address)}</small>` : ''}</div>`; }).join('') : '<div class="empty">📦<br>Nenhum pedido ainda.</div>');
  } catch (e) { $('#db').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
const adminForm = () => `<details><summary><b>＋ Novo produto</b></summary><form id="np"><input name="name" placeholder="Nome" required><input name="description" placeholder="Descrição">
  <input name="price" placeholder="Preço (ex: 24,90)" required><select name="store_id"><option value="">Loja</option>${S.stores.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
  <select name="category_id"><option value="">Categoria</option>${S.cats.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><button class="pri">Publicar</button></form></details>`;

/* ===== Conta ===== */
function authModal(m = 'login') {
  const r = m === 'register';
  $('#modal').innerHTML = `<form id="af" data-mode="${m}"><div class="tabs"><button type="button" class="${r ? '' : 'on'}" data-tab="login">Entrar</button><button type="button" class="${r ? 'on' : ''}" data-tab="register">Criar conta</button></div>
  ${r ? '<input name="name" placeholder="Seu nome" required>' : ''}<input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" placeholder="Senha (mín. 6)" minlength="6" required>
  <button class="pri">${r ? 'Criar conta' : 'Entrar'}</button><button type="button" data-close>Fechar</button></form>`;
  $('#modal').classList.add('on');
}
async function setUser() {
  try { S.user = S.token ? await api('/auth/me') : null; } catch { S.user = null; }
  $('#bUser').textContent = S.user ? '👤 ' + S.user.name.split(' ')[0] + ' · Sair' : 'Entrar';
}
function logout(silent) { try { sb.auth.signOut(); } catch (e) {} S.token = S.user = null; delete LS.token; setUser(); if (!silent) toast('Você saiu da conta'); }

/* ===== Eventos ===== */
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
  if (d.cat !== undefined) { S.cat = +d.cat; renderTop(); renderList(); }
  if (d.inc) { const p = S.prods.find(x => x.id == d.inc); if (!S.cart[d.inc] && p && !t.closest('#sh')) fly(t, emo(p)); change(+d.inc, 1); }
  if (d.dec) change(+d.dec, -1);
  if (d.tab) authModal(d.tab);
  if (d.close !== undefined) $('#modal').classList.remove('on');
  if (t.id === 'go') checkout();
  if (d.st) { const [id, status] = d.st.split(':'); try { await api(`/orders/${id}/status`, {method:'PATCH', json:{status}}); showOrders(); } catch (er) { toast(er.message, true); } }
});
document.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target, v = Object.fromEntries(new FormData(f));
  try {
    if (f.id === 'af') {
      if (f.dataset.mode === 'register') await api('/auth/register', {method:'POST', json:v});
      const r = await api('/auth/login', {method:'POST', body:new URLSearchParams({username:v.email, password:v.password})});
      S.token = LS.token = r.access_token; await setUser(); $('#modal').classList.remove('on'); toast('Olá, ' + S.user.name.split(' ')[0] + '!');
    }
    if (f.id === 'np') {
      await api('/products', {method:'POST', json:{name:v.name, description:v.description || '', price_cents:Math.round(parseFloat(v.price.replace(',', '.')) * 100), store_id:v.store_id ? +v.store_id : null, category_id:v.category_id ? +v.category_id : null}});
      S.prods = await api('/products?limit=200'); renderList(); toast('Produto publicado'); showOrders();
    }
  } catch (er) { toast(er.message, true); }
});
$('#q').oninput = e => { S.q = e.target.value; renderList(); };
$('#st').onchange = e => { S.store = +e.target.value; renderList(); };
$('#bud').oninput = e => $('#bv').textContent = 'R$ ' + e.target.value;
$('#mix').onclick = combo;
$('#dock').onclick = () => openSh('cart');
$('#bOrd').onclick = () => openSh('orders');
$('#bUser').onclick = () => S.user ? logout() : authModal();
$('#ov').onclick = $('#dx').onclick = closeSh;
$('#modal').onclick = e => { if (e.target.id === 'modal') e.target.classList.remove('on'); };
$('#conn').onclick = () => toast('Banco de dados: Supabase (PostgreSQL) na nuvem.');
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSh(); $('#modal').classList.remove('on'); } });
$('#surp').onclick = () => {
  if (!S.prods.length) return; S.cat = S.store = 0; S.q = ''; X.onlyFav = false; $('#favb').textContent = '🤍 Favoritos'; $('#favb').classList.remove('pri'); $('#q').value = ''; renderTop(); renderList();
  const p = S.prods[Math.floor(Math.random() * S.prods.length)], el = $('#p' + p.id);
  el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('hl'); toast(`Que tal ${p.name}? ${emo(p)}`);
};
/* ===== RECURSOS EXTRAS: favoritos, ordenação, detalhes, pedir de novo, avaliação e painel de indicadores ===== */
const KV = (() => { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return localStorage; } catch (e) { return {}; } })();
const jp = (k, d) => { try { return JSON.parse(KV[k] || d); } catch (e) { return JSON.parse(d); } };
const X = {fav:jp('ibag_fav', '[]'), rate:jp('ibag_rate', '{}'), sort:'', onlyFav:false, orders:[]};
const keep = () => { try { KV.ibag_fav = JSON.stringify(X.fav); KV.ibag_rate = JSON.stringify(X.rate); } catch (e) {} };
const eta = p => 20 + (p.id * 7) % 25;
const sortL = l => { const r = p => storeOf(p.store_id)?.rating || 0;
  return X.sort === 'lo' ? [...l].sort((a, b) => a.price_cents - b.price_cents) : X.sort === 'hi' ? [...l].sort((a, b) => b.price_cents - a.price_cents) : X.sort === 'top' ? [...l].sort((a, b) => r(b) - r(a)) : l; };
const rate = id => [1, 2, 3, 4, 5].map(n => `<button class="star" data-rate="${id}:${n}" aria-label="${n} estrelas">${n <= (X.rate[id] || 0) ? '⭐' : '☆'}</button>`).join('');
const dash = os => { const v = os.filter(o => o.status !== 'cancelled'), t = v.reduce((a, o) => a + o.total_cents, 0), c = {};
  v.forEach(o => o.items.forEach(i => c[i.product_name_snapshot] = (c[i.product_name_snapshot] || 0) + i.quantity));
  const top = Object.entries(c).sort((a, b) => b[1] - a[1])[0], k = (n, l) => `<div class="kpi"><b>${n}</b><small>${l}</small></div>`;
  return `<div class="kpis">${k(money(t), 'Faturamento')}${k(v.length, 'Pedidos válidos')}${k(v.length ? money(Math.round(t / v.length)) : '—', 'Ticket médio')}${k(top ? esc(top[0]) : '—', 'Mais vendido')}</div>`; };
function detail(id) {
  const p = S.prods.find(x => x.id === id), st = storeOf(p.store_id);
  $('#modal').innerHTML = `<form><div style="font-size:4rem;text-align:center">${emo(p)}</div><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p>
    <small>${esc(st?.name || 'iBag')} · ⭐ ${Number(st?.rating || 5).toFixed(1)} · ⏱️ ${eta(p)} min</small><b style="font-size:1.5rem">${money(p.price_cents)}</b>
    <button class="pri" data-inc="${p.id}" data-close>Adicionar à sacola</button><button type="button" data-close>Fechar</button></form>`;
  $('#modal').classList.add('on');
}
document.addEventListener('click', e => {
  const f = e.target.closest('[data-fav]'), d = e.target.closest('[data-det]'), a = e.target.closest('[data-again]'), r = e.target.closest('[data-rate]');
  if (f) { const id = +f.dataset.fav; X.fav = X.fav.includes(id) ? X.fav.filter(i => i !== id) : [...X.fav, id]; keep(); renderList(); }
  if (d) detail(+d.dataset.det);
  if (a) { const o = X.orders.find(x => x.id == a.dataset.again); (o?.items || []).forEach(i => { if (S.prods.some(p => p.id === i.product_id)) S.cart[i.product_id] = (S.cart[i.product_id] || 0) + i.quantity; });
    saveCart(); renderList(); toast('Itens do pedido #' + o.id + ' voltaram para a sacola'); openSh('cart'); }
  if (r) { const [id, n] = r.dataset.rate.split(':'); X.rate[id] = +n; keep(); showOrders(); toast('Obrigado pela avaliação!'); }
});
$('#srt').onchange = e => { X.sort = e.target.value; renderList(); };
$('#favb').onclick = e => { X.onlyFav = !X.onlyFav; e.target.textContent = X.onlyFav ? '❤️ Favoritos' : '🤍 Favoritos'; e.target.classList.toggle('pri', X.onlyFav); renderList(); };
setInterval(() => { if (S.dr === 'orders' && S.user) showOrders(); }, 8000);

/* ===== Início ===== */
(async () => {
  $('#list').innerHTML = '<div class="sk"></div>'.repeat(5);
  const c = $('#conn'), label = c.querySelector('span');
  try {
    await api('/health'); c.className = 'ok'; label.textContent = 'Supabase conectado';
    [S.cats, S.stores, S.prods] = await Promise.all([api('/categories'), api('/stores'), api('/products?limit=200')]);
    await setUser(); renderTop(); renderList(); saveCart();
  } catch (e) {
    c.className = 'off'; label.textContent = 'Supabase offline';
    $('#list').innerHTML = `<div class="empty">Não foi possível falar com o Supabase.<br>Confira a internet e se o projeto não está pausado (o plano gratuito pausa após inatividade).</div>`;
  }
})();
</script>
</body>
</html>
